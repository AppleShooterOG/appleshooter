<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Shooter</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: system-ui, -apple-system, Arial, sans-serif;
        background: #050508;
        color: #eaeaea;
        overflow: hidden;
    }

    canvas {
        position: fixed;
        inset: 0;
        z-index: -1;
        opacity: 0.18;
    }

    /* subtle vignette */
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, transparent 40%, #000 100%);
        pointer-events: none;
    }

    .wrap {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card {
        width: 600px;
        padding: 40px;
        border: 1px solid rgba(255,255,255,0.06);
        background: rgba(10,10,14,0.7);
        backdrop-filter: blur(16px);
        transform: translateY(10px);
        opacity: 0;
        animation: fade 1s ease forwards;
    }

    @keyframes fade {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .tag {
        font-size: 12px;
        letter-spacing: 2px;
        color: #777;
        margin-bottom: 10px;
    }

    h1 {
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -2px;
        margin-bottom: 10px;
    }

    .desc {
        color: #a1a1aa;
        font-size: 15px;
        line-height: 1.6;
        max-width: 520px;
    }

    .stats {
        display: flex;
        gap: 20px;
        margin-top: 25px;
        font-size: 12px;
        color: #666;
    }

    .btn {
        display: inline-block;
        margin-top: 30px;
        padding: 12px 22px;
        background: #fff;
        color: #000;
        text-decoration: none;
        font-size: 14px;
        transition: 0.2s;
    }

    .btn:hover {
        transform: translateY(-2px);
    }

    .footer {
        margin-top: 18px;
        font-size: 11px;
        color: #555;
    }
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="wrap">
    <div class="card">
        <div class="tag">INDIE SKILL GAME</div>

        <h1>Apple Shooter</h1>

        <div class="desc">
            A FPS Game made in unity. Minimalistic Design. Low poly. No high end device needed.
        </div>

        <div class="stats">
            <div>• skill based</div>
            <div>• fast rounds</div>
            <div>• minimal design</div>
        </div>

        <a class="btn" href="https://discord.gg/J4cRdWT7zR" target="_blank">
            ▶ Launch Game
        </a>

        <div class="footer">
            v1.0 • built for competitive precision
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let apples = [];

function spawn() {
    apples.push({
        x: Math.random() * canvas.width,
        y: -20,
        s: 0.3 + Math.random() * 1.2,
        r: 6 + Math.random() * 6
    });
}

setInterval(spawn, 800);

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < apples.length; i++) {
        let a = apples[i];
        a.y += a.s;

        ctx.beginPath();
        ctx.fillStyle = "#ff3b3b";
        ctx.globalAlpha = 0.7;
        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        if (a.y > canvas.height + 50) {
            apples.splice(i, 1);
            i--;
        }
    }

    requestAnimationFrame(draw);
}

draw();

window.addEventListener("resize", () => {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
});
</script>

</body>
</html>
