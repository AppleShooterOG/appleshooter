<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Shooter</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: system-ui, Arial, sans-serif;
        background: #0b0b0f;
        color: #fff;
        overflow: hidden;
    }

    canvas {
        position: fixed;
        inset: 0;
        z-index: -1;
        opacity: 0.35;
    }

    .wrap {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
    }

    .card {
        max-width: 600px;

        /* fade-in start state */
        opacity: 0;
        transform: translateY(20px);

        /* animation */
        animation: intro 1.2s ease forwards;
    }

    /* stagger effect */
    .card h1 { animation-delay: 0.1s; }
    .card p  { animation-delay: 0.2s; }
    .buttons { animation-delay: 0.3s; }
    .tag     { animation-delay: 0.4s; }

    @keyframes intro {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    h1 {
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -2px;
    }

    p {
        margin-top: 12px;
        color: #a1a1aa;
        font-size: 16px;
        line-height: 1.6;
    }

    .buttons {
        margin-top: 30px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
    }

    a {
        text-decoration: none;
        padding: 12px 22px;
        border-radius: 10px;
        font-size: 14px;
        transition: 0.2s ease;
    }

    .primary {
        background: white;
        color: black;
    }

    .primary:hover {
        transform: scale(1.04);
    }

    .ghost {
        border: 1px solid #2a2a2a;
        color: white;
    }

    .ghost:hover {
        border-color: #555;
    }

    .tag {
        margin-top: 15px;
        font-size: 12px;
        color: #666;
    }
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="wrap">
    <div class="card">
        <h1>Apple Shooter</h1>

        <p>
             A FPS Game inspired by banana shooter, Developed by hisbeestolgoes. First game ever made
        </p>

        <div class="buttons">
                <a class="primary" href="https://discord.gg/J4cRdWT7zR" target="_blank">
        ▶ Play Game 
            <a class="ghost" href="https://discord.gg/J4cRdWT7zR" target="_blank">Community</a>
        </div>

        <div class="tag">Made with love by hisbeestolgoes</div>
    </div>
</div>

<script>
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let apples = [];

function spawn() {
    apples.push({
        x: Math.random() * canvas.width,
        y: -20,
        r: 10 + Math.random() * 10,
        s: 0.5 + Math.random() * 1.5
    });
}

setInterval(spawn, 700);

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < apples.length; i++) {
        let a = apples[i];
        a.y += a.s;

        ctx.beginPath();
        ctx.fillStyle = "#ff4d4d";
        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
        ctx.fill();

        if (a.y > canvas.height + 50) {
            apples.splice(i, 1);
            i--;
        }
    }

    requestAnimationFrame(draw);
}

draw();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
